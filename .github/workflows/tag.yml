on:
  workflow_dispatch:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release

jobs:
  build:
    name: Create Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@master
      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: '11' # The JDK version to make available on the path.
          java-package: jdk # (jre, jdk, or jdk+fx) - defaults to jdk
          architecture: x64 # (x64 or x86) - defaults to x64
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build with Maven
        run: |
          mvn validate && mvn -B package --file pom.xml
          cp target/auik_prod*.jar target/auik-${{ github.ref_name }}.jar
          cd target
          sha256sum -b auik-${{ github.ref_name }}.jar > auik-${{ github.ref_name }}.jar.sha256sum
          ls
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body: |
            Änderungen in diesem Release:
            "Wir haben Fehler behoben, die Leistung gesteigert, den Müll runtergebracht und den Rasen gemäht – Zeit für ein Nickerchen"
          draft: true
          prerelease: true
          files: |
            ./target/auik-${{ github.ref_name }}.jar
            ./target/auik-${{ github.ref_name }}.jar.sha256sum
            ./data/db/fisumwelt_schema.sql
          fail_on_unmatched_files: true
