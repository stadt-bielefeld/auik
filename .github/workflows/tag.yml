on:
  workflow_dispatch:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release

permissions:
  contents: read

jobs:
  build:
    uses: $/.github/workflows/build.yml
  release:
    name: Create Release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: auik_prod-v*-shaded.jar
      - run: |
          cp auik_prod*.jar auik-${{ github.ref_name }}.jar
          sha256sum -b auik-${{ github.ref_name }}.jar > auik-${{ github.ref_name }}.jar.sha256sum
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body: |
            Änderungen in diesem Release:
            "Wir haben Fehler behoben, die Leistung gesteigert, den Müll runtergebracht und den Rasen gemäht – Zeit für ein Nickerchen"
          draft: true
          prerelease: true
          files: |
            auik-${{ github.ref_name }}.jar
            auik-${{ github.ref_name }}.jar.sha256sum
            ./data/db/fisumwelt_schema.sql
          fail_on_unmatched_files: true
